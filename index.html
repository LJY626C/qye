<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能建站系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; }
        .page { opacity: 0; transform: translateY(20px); animation: fadeInUp 0.5s ease-out forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15); }
        .btn-primary { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); transition: all 0.3s ease; }
        .btn-primary:hover { background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%); transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4); }
        .input-custom { transition: all 0.3s ease; }
        .input-custom:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); transform: translateY(-1px); }
        .tech-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%); }
        .template-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .template-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .template-card.selected { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }
        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .notification { animation: slideDown 0.4s ease-out; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .drop-zone { transition: all 0.3s ease; border: 2px dashed #cbd5e1; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .device-frame-pc { border: 12px solid #1f2937; border-radius: 16px; }
        .device-frame-tablet { border: 10px solid #1f2937; border-radius: 20px; }
        .device-frame-mobile { border: 12px solid #1f2937; border-radius: 28px; }
        .progress-bar-animated { background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6); background-size: 200% 100%; animation: shimmer 2s linear infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="notification" class="fixed top-0 left-0 right-0 z-50 hidden notification">
        <div class="bg-green-500 text-white py-4 px-6 shadow-lg">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span id="notificationText" class="font-medium">操作成功</span>
                </div>
                <button onclick="hideNotification()" class="hover:bg-green-600 rounded-lg p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <div id="loginPage" class="page min-h-screen flex items-center justify-center tech-gradient">
        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-purple-500/20 rounded-full blur-3xl"></div>
        </div>
        <div class="relative bg-white/95 backdrop-blur-lg rounded-3xl shadow-2xl p-10 w-full max-w-md mx-4">
            <div class="text-center mb-10">
                <div class="w-20 h-20 mx-auto bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl flex items-center justify-center mb-6 hover-lift">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 0 002 2z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">智能建站系统</h1>
                <p class="text-gray-500">快速打造专业企业官网</p>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">密码</label>
                    <input type="password" id="passwordInput" class="input-custom w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none text-lg" placeholder="请输入密码">
                </div>
                <div id="loginError" class="hidden text-red-500 text-sm text-center"></div>
                <button id="loginBtn" class="btn-primary w-full text-white py-4 rounded-xl font-semibold text-lg hover-lift">登录</button>
            </div>
            <p class="text-center text-gray-400 text-sm mt-8">默认密码: 123456</p>
        </div>
    </div>
    
    <div id="mainPage" class="page hidden">
        <div class="tech-gradient text-white relative overflow-hidden">
            <div class="absolute inset-0">
                <div class="absolute top-0 right-0 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl"></div>
                <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
            </div>
            <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
                <div class="flex flex-col lg:flex-row items-center justify-between">
                    <div class="text-center lg:text-left mb-10 lg:mb-0">
                        <h1 class="text-5xl font-bold mb-4">智能建站系统</h1>
                        <p class="text-xl text-blue-100 mb-2">10分钟打造你的专属企业官网</p>
                        <p class="text-blue-200">无需编程，一键生成，精美模板任你选</p>
                    </div>
                    <button id="createNewBtn" class="btn-primary text-white px-10 py-5 rounded-2xl font-semibold text-xl flex items-center space-x-3 hover-lift">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>创建新网站</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <h2 class="text-3xl font-bold text-gray-900 mb-8">我的网站</h2>
            <div id="recentWebsites" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="noWebsitesPlaceholder" class="text-center py-20 hidden">
                <div class="w-32 h-32 mx-auto bg-gray-100 rounded-full flex items-center justify-center mb-6">
                    <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 0 002 2z"></path>
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-gray-600 mb-2">还没有创建任何网站</h3>
                <p class="text-gray-400">点击上方按钮开始创建你的第一个网站</p>
            </div>
        </div>
    </div>
    
    <div id="createPage" class="page hidden">
        <div class="bg-white shadow-sm border-b sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
                <div class="flex items-center justify-between mb-2">
                    <button id="backToMainFromCreate" class="text-gray-600 hover:text-gray-900 flex items-center space-x-2 hover-lift">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                        <span>返回</span>
                    </button>
                </div>
                <div class="flex items-center justify-center space-x-4">
                    <div class="flex items-center step-indicator" id="step1Indicator">
                        <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-semibold" id="step1Dot">1</div>
                        <span class="ml-3 font-medium text-gray-900" id="step1Text">填写信息</span>
                    </div>
                    <div class="w-24 h-1 bg-gray-200 rounded" id="line1"></div>
                    <div class="flex items-center step-indicator" id="step2Indicator">
                        <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center font-semibold" id="step2Dot">2</div>
                        <span class="ml-3 font-medium text-gray-500" id="step2Text">选择模板</span>
                    </div>
                    <div class="w-24 h-1 bg-gray-200 rounded" id="line2"></div>
                    <div class="flex items-center step-indicator" id="step3Indicator">
                        <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center font-semibold" id="step3Dot">3</div>
                        <span class="ml-3 font-medium text-gray-500" id="step3Text">生成网站</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="step1Content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <div class="grid lg:grid-cols-2 gap-8">
                <div class="bg-white rounded-2xl shadow-lg p-8">
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-2xl font-bold text-gray-900">企业信息</h2>
                        <button id="fillDemoBtn" class="text-blue-600 hover:text-blue-700 font-medium flex items-center space-x-2 hover-lift">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            <span>一键填充演示数据</span>
                        </button>
                    </div>
                    <div class="space-y-6">
                        <div><label class="block text-gray-700 font-medium mb-2">企业名称</label><input type="text" id="companyName" class="input-custom w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none" placeholder="请输入企业名称"></div>
                        <div><label class="block text-gray-700 font-medium mb-2">联系电话</label><input type="tel" id="companyPhone" class="input-custom w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none" placeholder="请输入联系电话"></div>
                        <div><label class="block text-gray-700 font-medium mb-2">企业简介</label><textarea id="companyDesc" rows="4" class="input-custom w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none resize-none" placeholder="请输入企业简介"></textarea></div>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div><label class="block text-gray-700 font-medium mb-2">邮箱</label><input type="email" id="companyEmail" class="input-custom w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none" placeholder="请输入邮箱"></div>
                            <div><label class="block text-gray-700 font-medium mb-2">详细地址</label><input type="text" id="companyAddress" class="input-custom w-full px-5 py-4 border border-gray-300 rounded-xl focus:outline-none" placeholder="请输入详细地址"></div>
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">企业Logo</label>
                            <div id="logoDropZone" class="drop-zone rounded-xl p-8 text-center cursor-pointer">
                                <div id="logoPreview" class="hidden"><img id="logoImage" class="w-24 h-24 mx-auto mb-4 rounded-lg object-contain" alt="Logo预览"><button id="removeLogo" class="text-red-500 text-sm hover:text-red-600">删除</button></div>
                                <div id="logoPlaceholder">
                                    <svg class="w-12 h-12 mx-auto text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                    </svg>
                                    <p class="text-gray-600">拖拽图片到这里或点击上传</p>
                                    <p class="text-gray-400 text-sm mt-1">支持 JPG、PNG 格式</p>
                                </div>
                            </div>
                            <input type="file" id="logoInput" class="hidden" accept="image/*">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-4">轮播图（可选）</label>
                            <div class="grid md:grid-cols-3 gap-4">
                                <div id="banner1DropZone" class="drop-zone rounded-xl p-4 text-center cursor-pointer">
                                    <div id="banner1Preview" class="hidden"><img id="banner1Image" class="w-full h-32 object-cover rounded-lg mb-2" alt="轮播图1预览"><button id="removeBanner1" class="text-red-500 text-sm hover:text-red-600">删除</button></div>
                                    <div id="banner1Placeholder">
                                        <svg class="w-8 h-8 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 0 002 2z"></path>
                                        </svg>
                                        <p class="text-gray-500 text-xs">图1</p>
                                    </div>
                                </div>
                                <div id="banner2DropZone" class="drop-zone rounded-xl p-4 text-center cursor-pointer">
                                    <div id="banner2Preview" class="hidden"><img id="banner2Image" class="w-full h-32 object-cover rounded-lg mb-2" alt="轮播图2预览"><button id="removeBanner2" class="text-red-500 text-sm hover:text-red-600">删除</button></div>
                                    <div id="banner2Placeholder">
                                        <svg class="w-8 h-8 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 0 002 2z"></path>
                                        </svg>
                                        <p class="text-gray-500 text-xs">图2</p>
                                    </div>
                                </div>
                                <div id="banner3DropZone" class="drop-zone rounded-xl p-4 text-center cursor-pointer">
                                    <div id="banner3Preview" class="hidden"><img id="banner3Image" class="w-full h-32 object-cover rounded-lg mb-2" alt="轮播图3预览"><button id="removeBanner3" class="text-red-500 text-sm hover:text-red-600">删除</button></div>
                                    <div id="banner3Placeholder">
                                        <svg class="w-8 h-8 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 0 002 2z"></path>
                                        </svg>
                                        <p class="text-gray-500 text-xs">图3</p>
                                    </div>
                                </div>
                            </div>
                            <input type="file" id="banner1Input" class="hidden" accept="image/*">
                            <input type="file" id="banner2Input" class="hidden" accept="image/*">
                            <input type="file" id="banner3Input" class="hidden" accept="image/*">
                        </div>
                    </div>
                    <div class="mt-10 flex justify-end"><button id="toStep2FromInfo" class="btn-primary text-white px-10 py-4 rounded-xl font-semibold text-lg hover-lift">下一步：选择模板</button></div>
                </div>
                <div class="bg-white rounded-2xl shadow-lg p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">实时预览</h3>
                    <div class="border-2 border-gray-200 rounded-xl overflow-hidden bg-gray-50">
                        <div class="bg-gray-100 px-4 py-2 border-b flex items-center space-x-2">
                            <div class="w-3 h-3 rounded-full bg-red-400"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                            <div class="w-3 h-3 rounded-full bg-green-400"></div>
                        </div>
                        <div id="livePreview" class="h-[600px] overflow-auto p-4">
                            <div class="text-center text-gray-400 py-20">
                                <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                                <p>开始填写信息，这里会显示预览</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="step2Content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 hidden">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-bold text-gray-900">选择模板</h2>
                <button id="backToStep1FromTemplate" class="text-gray-600 hover:text-gray-900 flex items-center space-x-2 hover-lift">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    <span>返回修改信息</span>
                </button>
            </div>
            <div id="templateGrid" class="grid md:grid-cols-3 gap-8"></div>
            <div class="mt-12 flex justify-end"><button id="toStep3FromTemplate" class="btn-primary text-white px-10 py-4 rounded-xl font-semibold text-lg hover-lift" disabled>下一步：生成网站</button></div>
        </div>
        
        <div id="step3Content" class="min-h-screen flex items-center justify-center tech-gradient hidden">
            <div class="text-center text-white">
                <div class="mb-8"><svg class="w-24 h-24 mx-auto loading-spinner" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></div>
                <h2 class="text-3xl font-bold mb-4">正在生成您的网站...</h2>
                <div id="generationSteps" class="space-y-4 mb-8">
                    <div class="flex items-center justify-center space-x-3"><div class="w-3 h-3 rounded-full bg-blue-400 pulse-dot"></div><span id="stepText1" class="text-blue-200">加载模板...</span></div>
                    <div class="flex items-center justify-center space-x-3"><div class="w-3 h-3 rounded-full bg-gray-500" id="stepDot2"></div><span id="stepText2" class="text-gray-400">填充企业信息...</span></div>
                    <div class="flex items-center justify-center space-x-3"><div class="w-3 h-3 rounded-full bg-gray-500" id="stepDot3"></div><span id="stepText3" class="text-gray-400">生成完整网站...</span></div>
                </div>
                <div class="w-64 mx-auto bg-white/20 rounded-full h-2 overflow-hidden"><div id="genProgressBar" class="h-full bg-white rounded-full progress-bar-animated" style="width: 0%"></div></div>
            </div>
        </div>
    </div>
    
    <div id="templateModal" class="fixed inset-0 bg-black/90 z-50 hidden">
        <div class="absolute top-4 right-4 flex items-center space-x-4">
            <div class="flex bg-gray-800 rounded-lg p-1">
                <button id="modalPcView" class="px-4 py-2 rounded-lg bg-white text-gray-900 font-medium">PC</button>
                <button id="modalTabletView" class="px-4 py-2 rounded-lg text-gray-400 font-medium">平板</button>
                <button id="modalMobileView" class="px-4 py-2 rounded-lg text-gray-400 font-medium">手机</button>
            </div>
            <button id="closeModal" class="text-white hover:text-gray-300 p-2 hover-lift">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="h-full flex items-center justify-center pt-20 pb-8 px-4">
            <div id="modalPreviewContainer" class="device-frame-pc"><iframe id="modalPreviewFrame" class="bg-white" style="width: 1024px; height: 600px; border: none;"></iframe></div>
        </div>
    </div>
    
    <div id="previewPage" class="page hidden min-h-screen bg-gray-100">
        <div class="bg-white shadow-sm sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-6">

        document.getElementById('passwordInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
        document.getElementById('createNewBtn').addEventListener('click', () => { showPage('createPage'); showCreateStep(1); currentCreateStep = 1; selectedIndustry = 'tech'; selectedTemplate = null; websiteData = { companyName: '', companyDesc: '', companyPhone: '', companyEmail: '', companyAddress: '', logo: null, banners: [null, null, null] }; document.getElementById('companyName').value = ''; document.getElementById('companyPhone').value = ''; document.getElementById('companyDesc').value = ''; document.getElementById('companyEmail').value = ''; document.getElementById('companyAddress').value = ''; ['logo', 'banner1', 'banner2', 'banner3'].forEach(id => { const preview = document.getElementById(`${id}Preview`), placeholder = document.getElementById(`${id}Placeholder`); if (preview) preview.classList.add('hidden'); if (placeholder) placeholder.classList.remove('hidden'); }); updateLivePreview(); });
        document.getElementById('backToMainFromCreate').addEventListener('click', () => { showPage('mainPage'); loadRecentWebsites(); });
        setupDropZone('logoDropZone', 'logoInput', 'logoPreview', 'logoImage', 'logoPlaceholder', 'removeLogo');
        setupDropZone('banner1DropZone', 'banner1Input', 'banner1Preview', 'banner1Image', 'banner1Placeholder', 'removeBanner1', 0);
        setupDropZone('banner2DropZone', 'banner2Input', 'banner2Preview', 'banner2Image', 'banner2Placeholder', 'removeBanner2', 1);
        setupDropZone('banner3DropZone', 'banner3Input', 'banner3Preview', 'banner3Image', 'banner3Placeholder', 'removeBanner3', 2);
        ['companyName', 'companyPhone', 'companyDesc', 'companyEmail', 'companyAddress'].forEach(id => { document.getElementById(id).addEventListener('input', updateLivePreview); });
        document.getElementById('fillDemoBtn').addEventListener('click', () => { document.getElementById('companyName').value = demoData.companyName; document.getElementById('companyPhone').value = demoData.companyPhone; document.getElementById('companyDesc').value = demoData.companyDesc; document.getElementById('companyEmail').value = demoData.companyEmail; document.getElementById('companyAddress').value = demoData.companyAddress; websiteData.companyName = demoData.companyName; websiteData.companyPhone = demoData.companyPhone; websiteData.companyDesc = demoData.companyDesc; websiteData.companyEmail = demoData.companyEmail; websiteData.companyAddress = demoData.companyAddress; updateLivePreview(); showNotification('已填充演示数据'); });
        document.getElementById('toStep2FromInfo').addEventListener('click', () => { websiteData.companyName = document.getElementById('companyName').value; websiteData.companyPhone = document.getElementById('companyPhone').value; websiteData.companyDesc = document.getElementById('companyDesc').value; websiteData.companyEmail = document.getElementById('companyEmail').value; websiteData.companyAddress = document.getElementById('companyAddress').value; showCreateStep(2); });
        document.getElementById('backToStep1FromTemplate').addEventListener('click', () => showCreateStep(1));
        document.getElementById('toStep3FromTemplate').addEventListener('click', () => generateWebsite());
        document.getElementById('closeModal').addEventListener('click', () => document.getElementById('templateModal').classList.add('hidden'));
        document.getElementById('templateModal').addEventListener('click', (e) => { if (e.target === document.getElementById('templateModal')) document.getElementById('templateModal').classList.add('hidden'); });
        document.getElementById('modalPcView').addEventListener('click', () => setModalDeviceView('pc'));
        document.getElementById('modalTabletView').addEventListener('click', () => setModalDeviceView('tablet'));
        document.getElementById('modalMobileView').addEventListener('click', () => setModalDeviceView('mobile'));
        document.getElementById('previewPcView').addEventListener('click', () => setPreviewDeviceView('pc'));
        document.getElementById('previewTabletView').addEventListener('click', () => setPreviewDeviceView('tablet'));
        document.getElementById('previewMobileView').addEventListener('click', () => setPreviewDeviceView('mobile'));
        document.getElementById('exportFromPreview').addEventListener('click', () => exportWebsite(generatedHtml, websiteData.companyName || 'website'));
        document.getElementById('backFromPreview').addEventListener('click', () => { showPage('mainPage'); loadRecentWebsites(); });
    </script>
</body>
